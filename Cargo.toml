[package]
name = "atelier"
version = "0.1.0"
edition = "2024"

[dependencies]
symphonia = { version = "0.6.1", features = ["aac", "isomp4", "mp3", "alac"] }
symphonia-adapter-libopus = "0.3.0"
cpal = "0.18.2"
rubato = "5.0.0"

thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
crossbeam-channel = "0.5.16"

rtrb = "0.4.0"
mpris-server = "0.10.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs"] }
iced = { version = "0.14.0", features = ["tokio", "canvas", "image"] }
reqwest = "0.13.4"
discord-rich-presence = "1.1.0"
itertools = "0.15.0"
futures = "0.3.34"
dotenvy = "0.15.7"
image = "0.25.10"
lru = "0.18.2"
ksni = { version = "0.3.6" , features = ["tokio"]}
libc = "0.2.189"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }

musichub-client = { path = "../musichub-client" }
rand = "0.10.2"
uuid = { version = "1.24.1", features = ["v4"] }
rfd = "0.17.2"
strum_macros = "0.28.0"

[profile.release]
lto = "thin"
codegen-units = 1
